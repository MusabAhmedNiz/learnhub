services:
  storage:
    # Community build of upstream MinIO, pinned to a fixed image digest.
    image: ghcr.io/coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: minio server /data --console-address :9001
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: learnhub-local
      MINIO_ROOT_PASSWORD: learnhub-local-password
      MINIO_API_CORS_ALLOW_ORIGIN: ${BETTER_AUTH_URL:-http://localhost:3000}
      MC_HOST_local: http://learnhub-local:learnhub-local-password@localhost:9000
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  minio-data:
